# CI checks only what can be verified without a server: syntax, input
# validation, template rendering and the proxy configuration.
# It does NOT run provisioning. See docs/testing.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit that the v7.0.1 tag pointed at when this file
      # was written (resolved through the GitHub API).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the secret scan covers every commit.
          fetch-depth: 0

      - name: Syntax check (bash -n)
        run: |
          for file in bin/vps-stack lib/*.sh scripts/*.sh tests/helpers.bash examples/*.sh.example; do
            bash -n "${file}"
          done

      # shellcheck is part of the ubuntu-latest runner image.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x bin/vps-stack lib/*.sh scripts/*.sh tests/helpers.bash examples/*.sh.example </dev/null

      # The status page tests need jq, which the bats image does not ship.
      - name: bats
        run: |
          docker run --rm -v "${PWD}:/code:ro" --entrypoint sh bats/bats:1.14.0 \
            -c 'apk add --no-cache jq >/dev/null && bats tests/'

      # The fixture holds Caddy access log lines: failed logins, requests
      # without credentials, a successful login and two injection attempts
      # that try to get 198.51.100.9 banned.
      - name: fail2ban filter
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fail2ban >/dev/null
          fail2ban-regex --version
          actual="$(fail2ban-regex -o ip tests/fixtures/monitor-access.log templates/fail2ban-monitor-filter.conf)"
          expected="$(printf '%s\n' 203.0.113.10 203.0.113.10 203.0.113.10 203.0.113.50 2001:db8::5)"
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'Expected:\n%s\nGot:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi

      - name: docker compose config
        env:
          ACME_EMAIL: admin@example.com
        run: |
          docker compose -f proxy/docker-compose.yml config --quiet
          # With the status page mounts, as `vps-stack proxy` runs it.
          docker compose -f proxy/docker-compose.yml -f proxy/docker-compose.monitor.yml config --quiet
          # The example refers to the project's own .env, which only exists
          # on a real deployment. One with APP_TAG is enough to check the
          # syntax (the image reference requires it).
          printf 'APP_TAG=example\n' >examples/.env
          docker compose -f examples/project-compose.yml.example config --quiet
          rm -f examples/.env

      - name: systemd unit of the status page collector
        run: |
          unit_dir="$(mktemp -d)"
          bash -c 'source lib/common.sh
            render_template templates/vps-stack-monitor.service.tmpl \
              "VPS_STACK_BIN=$1" "RUN_DIR=/run/vps-stack-monitor"' _ "${PWD}/bin/vps-stack" \
            >"${unit_dir}/vps-stack-monitor.service"
          cat "${unit_dir}/vps-stack-monitor.service"
          systemd-analyze verify "${unit_dir}/vps-stack-monitor.service"

      - name: caddy validate
        run: |
          image="$(awk '$1 == "image:" && $2 ~ /^caddy:/ { print $2 }' proxy/docker-compose.yml)"
          test -n "${image}"
          sites="$(mktemp -d)"
          chmod 755 "${sites}"
          # The status page logs to this directory; Caddy opens the file
          # during validation.
          logs="$(mktemp -d)"
          validate() {
            docker run --rm -e ACME_EMAIL=admin@example.com \
              -v "${PWD}/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "${sites}:/etc/caddy/sites:ro" \
              -v "${logs}:/var/log/vps-stack-monitor" \
              "${image}" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1
          }

          echo "::group::empty sites directory"
          validate
          echo "::endgroup::"

          bash -c 'source lib/common.sh; source lib/validate.sh
            site_render templates/site-standard.caddy.tmpl example.com example-app-web:80 \
              app.example.com www.example.com,example.org 50MB' >"${sites}/example.com.caddy"
          chmod 644 "${sites}/example.com.caddy"
          cat "${sites}/example.com.caddy"

          echo "::group::generated site file"
          output="$(validate)"
          echo "${output}"
          echo "::endgroup::"
          # Guard against a vacuous pass: the generated file must really
          # have been loaded by Caddy.
          if grep -q "No files matching import glob pattern" <<<"${output}"; then
            echo "Caddy did not see the generated site file" >&2
            exit 1
          fi

          # Status page: a real hash from the pinned image, then an empty
          # and a non-empty ban list.
          hash="$(printf 'ci-only\n' | docker run --rm -i "${image}" caddy hash-password --bcrypt-cost 10)"
          bash -c 'source lib/common.sh; source lib/validate.sh; source lib/monitor.sh
            monitor_site_render templates/site-monitor.caddy.tmpl status.example.com monitor-ci "$1"' \
            _ "${hash}" >"${sites}/_monitor.caddy"
          chmod 644 "${sites}/_monitor.caddy"
          for bans in "" "203.0.113.7 2001:db8::1"; do
            # shellcheck disable=SC2086  # word splitting wanted: list of addresses
            bash -c 'source lib/common.sh; source lib/validate.sh; source lib/monitor.sh
              monitor_ban_snippet "$@"' _ ${bans} >"${sites}/.monitor-banned"
            chmod 644 "${sites}/.monitor-banned"
            echo "::group::status page, bans: ${bans:-none}"
            cat "${sites}/.monitor-banned"
            validate
            echo "::endgroup::"
          done

      - name: Healthcheck command exists in the image
        run: |
          image="$(awk '$1 == "image:" && $2 ~ /^caddy:/ { print $2 }' proxy/docker-compose.yml)"
          docker run --rm "${image}" sh -c 'command -v wget'

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${PWD}:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
