# Managed by vps-stack (monitor). Manual edits are overwritten.
#
# Failed logins on the status page, read from the Caddy access log (JSON):
# a request that carried credentials (Authorization, logged as REDACTED) and
# got 401. A request without credentials, such as the first visit of a
# browser before it shows the login prompt, does not count.
#
# <HOST> is the first "request":{"remote_ip":"..." of the line, which Caddy
# writes before any value a client controls. Client values (URI, headers)
# are JSON strings with their quotes escaped, so they cannot fake this
# sequence, the Authorization entry or the top-level status.
# Tested by CI with fail2ban-regex on tests/fixtures/monitor-access.log.

[Definition]
failregex = ^\{.*?"request":\{"remote_ip":"<HOST>",.*"Authorization":\["REDACTED"\].*"status":401,
ignoreregex =
datepattern = "ts":{Epoch}
