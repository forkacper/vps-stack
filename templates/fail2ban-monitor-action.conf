# Managed by vps-stack (monitor). Manual edits are overwritten.
#
# Bans on the status page only, inside Caddy: the address is added to the
# list imported at the top of the status page route, the configuration is
# validated and Caddy is reloaded without downtime. The firewall is not
# touched, so a banned address keeps access to every other site.
#
# The list is cleared when the jail starts; fail2ban then restores the bans
# still in force from its own database by calling actionban again.

[Definition]
actionstart = {{VPS_STACK_BIN}} monitor ban-reset
actionstop = {{VPS_STACK_BIN}} monitor ban-reset
actioncheck =
actionban = {{VPS_STACK_BIN}} monitor ban <ip>
actionunban = {{VPS_STACK_BIN}} monitor unban <ip>
