<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Server status</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="top">
        <div>
            <h1 id="hostname">Server status</h1>
            <p class="muted" id="subtitle">vps-stack</p>
        </div>
        <p class="freshness" id="freshness" data-state="loading">Loading…</p>
    </header>

    <p class="banner" id="banner" hidden></p>

    <main>
        <section class="cards" aria-label="Server resources">
            <article class="card">
                <h2>CPU</h2>
                <p class="value" id="cpu-value">–</p>
                <div class="bar"><span id="cpu-bar"></span></div>
                <p class="muted" id="cpu-detail">–</p>
            </article>
            <article class="card">
                <h2>Memory</h2>
                <p class="value" id="mem-value">–</p>
                <div class="bar"><span id="mem-bar"></span></div>
                <p class="muted" id="mem-detail">–</p>
            </article>
            <article class="card">
                <h2>Swap</h2>
                <p class="value" id="swap-value">–</p>
                <div class="bar"><span id="swap-bar"></span></div>
                <p class="muted" id="swap-detail">–</p>
            </article>
            <article class="card">
                <h2>Disk /</h2>
                <p class="value" id="disk-value">–</p>
                <div class="bar"><span id="disk-bar"></span></div>
                <p class="muted" id="disk-detail">–</p>
            </article>
        </section>

        <section aria-labelledby="containers-title">
            <div class="section-head">
                <h2 id="containers-title">Containers</h2>
                <p class="muted" id="containers-summary"></p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Image</th>
                            <th scope="col">State</th>
                            <th scope="col">Up for</th>
                            <th scope="col" class="num">Restarts</th>
                            <th scope="col" class="num">CPU</th>
                            <th scope="col">Memory</th>
                        </tr>
                    </thead>
                    <tbody id="containers"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="muted">
        Refreshed every few seconds. Read-only view generated by vps-stack monitor.
    </footer>
</body>
</html>
